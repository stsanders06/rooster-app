---
configuration:
  log_level:
    name: Log level
    description: How much detail is written to the add-on log.
  gebruikersnaam:
    name: MyManus username
    description: >-
      The username you use on MyManus. Leave empty to enter it inside the app.
  wachtwoord:
    name: MyManus password
    description: >-
      The MyManus password. This field is masked. Leave empty to enter it
      inside the app.
  sync_uren:
    name: Sync interval (hours)
    description: Hours between automatic syncs. Default is 4. Manual refresh is always available.
  verlof_opbouw_uren:
    name: Leave accrual (hours per year)
    description: >-
      Hours of leave a full calendar year accrues. Default is 144. The app
      divides this by 365 or 366, per day.
  verlof_vanaf:
    name: Leave from
    description: >-
      Date leave accrual starts, as YYYY-MM-DD. Default is 2026-10-01.
      Before that date the balance stays at zero.
