---
name: Rooster
version: "1.3.0"
slug: rooster_app
description: >-
  Rooster, uren en een geschat salaris uit MyManus, met een agendafeed
  voor je telefoon
url: https://github.com/stsanders06/rooster-app/tree/main/rooster_app
arch:
  - aarch64
  - amd64
init: false
ingress: true
# Geen ingress_port: 8099 is de standaard, en de linter wijst een
# expliciete standaardwaarde af. De app luistert op diezelfde poort.
panel_icon: mdi:calendar-clock
panel_title: Rooster
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: >-
    Agendafeed. Het dashboard zelf open je via de zijbalk; op deze poort
    antwoordt alleen de geheime agendalink.
options:
  log_level: info
  gebruikersnaam: ""
  wachtwoord: ""
  sync_uren: 4
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  gebruikersnaam: str?
  wachtwoord: password?
  sync_uren: int(1,168)
